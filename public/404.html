<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=./" />
    <script>
      // GitHub Pages 不支持 SPA 的 history 路由回退；这里把原始深链接编码后跳回站点根路径，
      // 再由 index.html 恢复 URL（避免直接访问 /willow-editor/live/... 发生 404 导致 SW 无法注册）。
      (function () {
        var l = window.location;
        var parts = l.pathname.split('/').filter(Boolean);
        var base = parts.length ? '/' + parts[0] + '/' : '/';
        var target = base + '?redirect=' + encodeURIComponent(l.pathname + l.search + l.hash);
        l.replace(target);
      })();
    </script>
  </head>
  <body>
    Redirecting…
  </body>
</html>
